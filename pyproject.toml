[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-activity-tracker"
version = "1.0.0"
description = "Sentinel Discord Intelligence & User Activity Tracker"
readme = "README_TRACKER.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4.0",
    "python-dotenv>=1.0.0",
    "tzlocal>=4.0.0,<6",
    "aiohttp>=3.7.4,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
